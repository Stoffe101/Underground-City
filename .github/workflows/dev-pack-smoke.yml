name: Dev pack smoke (real TaCZ and vehicle mods)
# Runs the Core GameTests with exact, hash-verified Modrinth pins from content/modpacks/dev-pack.json added as
# runtime-only dependencies. No mod binary is committed or uploaded. Core's own tests skip anything whose mod is
# absent, so the plain economy job stays valid; this job is where the optional-mod cases actually execute.
on:
  pull_request:
    paths:
      - 'rpg-core/**'
      - 'content/modpacks/dev-pack*.json'
      - 'content/gameplay/contracts.json'
      - 'scripts/resolve_dev_pack.py'
      - 'scripts/fetch_dev_pack.py'
      - 'scripts/run_prod_boot_check.py'
      - 'scripts/install_qshop_templates.py'
      - '.github/workflows/dev-pack-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dev-pack-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pins:
    name: Pins still resolve and match
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare the committed manifest with the Modrinth API
        run: python scripts/resolve_dev_pack.py --check
  smoke:
    name: GameTests with the ${{ matrix.pack }} set
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - pack: firearms
            sets: firearms
          - pack: vehicles
            sets: vehicles
          # the opt-in candidates of the October 17 sprint (Vinery, Farm & Charm, Kaleidoscope Tavern); not part of the default pack
          - pack: living
            sets: vintner,farming
          # the opt-in survival set (D-085): Traveler's Backpack, Thirst Was Taken 2, Farmer's Delight, Comforts; includes the sleeping-bag respawn GameTest
          - pack: survival
            sets: survival
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Stage original Q Shop templates in a disposable instance
        run: python scripts/install_qshop_templates.py --server-root rpg-core/run-pack-${{ matrix.pack }}
      - name: Run the Core GameTests with the ${{ matrix.pack }} mods loaded
        run: gradle -p rpg-core runGameTestServer -PucPack=${{ matrix.sets }} -PucEconomyTest=true -PucRunDir=run-pack-${{ matrix.pack }} --no-daemon --stacktrace
      - name: Print which tests failed (a failing GameTest makes the server exit 1; the reason is in the log)
        if: failure()
        run: |
          grep -E 'failed!|required tests|GAME TESTS COMPLETE|Exception caught|Crash report' rpg-core/run-pack-${{ matrix.pack }}/logs/latest.log | head -n 40 || true
      - name: Confirm the mods really loaded and the tests ran (a server that failed to start still exits 0)
        run: |
          set -euo pipefail
          log=rpg-core/run-pack-${{ matrix.pack }}/logs/latest.log
          test -s "$log"
          if [ "${{ matrix.pack }}" = "firearms" ]; then
            grep -q "TaCZ Blueprints mod initializing" "$log"
            grep -q "Registered synced data key tacz:" "$log"
          elif [ "${{ matrix.pack }}" = "survival" ]; then
            grep -q "ThirstWasTaken2 initialized" "$log"
            grep -q "Registered the FluidEffect with Unique ID of minecraft:water" "$log"
          elif [ "${{ matrix.pack }}" = "living" ]; then
            grep -q "Registered /wine command" "$log"
            grep -q "farm_and_charm:set_text" "$log"
            grep -q "Successfully loaded drink effect data" "$log"
          else
            grep -q "Welcome to MTS VERSION" "$log"
          fi
          grep -E "All [0-9]+ required tests passed" "$log"
      - name: Preserve diagnostics without third-party binaries or world saves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uc-dev-pack-${{ matrix.pack }}-diagnostics-${{ github.sha }}
          path: rpg-core/run-pack-${{ matrix.pack }}/logs/*.log
          retention-days: 3
          if-no-files-found: warn
  production-boot:
    name: Production-style dedicated server with every pinned mod
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build the reobfuscated Core jar
        run: gradle -p rpg-core build --no-daemon --stacktrace
      - name: Install Forge, stage the hash-verified mods and boot a real server
        run: python scripts/run_prod_boot_check.py --sets firearms vehicles boats --work build/prod-boot
      # the opt-in survival set (D-085) on its own, as it was verified locally; the combination with the other sets has not been booted
      - name: Boot a real server with the opt-in survival set
        run: python scripts/run_prod_boot_check.py --sets survival --work build/prod-boot-survival
      - name: Preserve the report and server log without jars or world saves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uc-prod-boot-${{ github.sha }}
          path: |
            build/prod-boot/prod-boot-report.json
            build/prod-boot/server/boot-stdout.log
            build/prod-boot/server/logs/latest.log
            build/prod-boot-survival/prod-boot-report.json
            build/prod-boot-survival/server/boot-stdout.log
            build/prod-boot-survival/server/logs/latest.log
          retention-days: 3
          if-no-files-found: warn
