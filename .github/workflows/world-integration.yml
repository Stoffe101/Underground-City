name: World and property mod smoke matrix

on:
  pull_request:
    paths:
      - 'content/modpacks/world-mod-candidates.json'
      - 'content/region-blueprints/**'
      - 'scripts/build_world_prototype.py'
      - 'scripts/install_world_prototype.py'
      - 'rpg-core/src/main/**'
      - 'rpg-core/build.gradle'
      - '.github/workflows/world-integration.yml'
  push:
    branches: [main]
    paths:
      - 'content/modpacks/world-mod-candidates.json'
      - 'content/region-blueprints/**'
      - 'scripts/build_world_prototype.py'
      - 'scripts/install_world_prototype.py'
      - 'rpg-core/src/main/**'
      - 'rpg-core/build.gradle'
      - '.github/workflows/world-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pins:
    name: Validate pinned releases
    runs-on: ubuntu-latest
    outputs:
      candidates: ${{ steps.list.outputs.candidates }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.schema_version == 1 and .minecraft == "1.20.1" and .forge == "47.4.10" and (.candidates | length == 4)' content/modpacks/world-mod-candidates.json
          echo "candidates=$(jq -c '[.candidates[].id]' content/modpacks/world-mod-candidates.json)" >> "$GITHUB_OUTPUT"

  smoke:
    name: Forge smoke / ${{ matrix.candidate }}
    needs: validate-pins
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(needs.validate-pins.outputs.candidates) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Generate original low-code city data when testing Lost Cities
        env:
          CANDIDATE: ${{ matrix.candidate }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_intercity.py
          if [[ "$CANDIDATE" == "qshop" ]]; then
            python scripts/install_qshop_templates.py --server-root rpg-core/run
          fi
          if [[ "$CANDIDATE" == "lostcities" ]]; then
            mkdir -p rpg-core/run/mods
            python scripts/build_world_prototype.py --output rpg-core/run/mods/underground-city-world-prototype.jar
          fi
      - name: Resolve pinned mod and launch Forge GameTestServer
        env:
          CANDIDATE: ${{ matrix.candidate }}
        shell: bash
        run: |
          set -euo pipefail
          gradle -p rpg-core runGameTestServer -PucWorldCandidate="$CANDIDATE" --no-daemon --stacktrace
      - name: Survey actual native city generation in a fresh dedicated world
        if: matrix.candidate == 'lostcities'
        shell: bash
        run: |
          python scripts/install_world_prototype.py --server-root rpg-core/run-world-survey
          python scripts/install_qshop_templates.py --server-root rpg-core/run-world-survey
          printf 'eula=true\n' > rpg-core/run-world-survey/eula.txt
          cp content/region-blueprints/corridors.json rpg-core/run-world-survey/corridors.json
          printf 'level-seed=579\nserver-ip=127.0.0.1\nonline-mode=false\nview-distance=3\nsimulation-distance=3\n' > rpg-core/run-world-survey/server.properties
          timeout 1700s gradle -p rpg-core runServer -PucWorldCandidate=lostcities -PucEconomyTest=true -PucRunDir=run-world-survey -PucWorldSurvey=true --no-daemon --stacktrace
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('rpg-core/run-world-survey/world-survey.json').read_text())
          assert report['status']=='three_city_structures_observed', report
          assert len(report['observations'])==3
          assert report['qshop_credits_ready'] is True, report
          roads=report['roads']['routes']
          assert [r['id'] for r in roads]==['ironhaven_valewood','ironhaven_blackwater'], roads
          for road in roads:
              # Real blocks read along the whole centreline (one sample per block).
              assert road['continuous'] is True, road
              assert road['samples_checked']>1000, road
              assert road['deck_missing']==0 and road['headroom_blocked']==0 and road['steps_over_half_block']==0, road
              assert road['parapets_expected']>0 and road['parapets_missing']==0, road
              assert road['bridge_samples']>0 and road['water_samples_below_deck']>0, road
              assert road['min_free_blocks_over_water']>=3, road
              assert 'showcase' in road and 'land_showcase' in road, road
          print('roads', [(r['id'], r['samples_checked'], r['longest_bridge_blocks']) for r in roads])
          PY
      - name: Preserve native world-survey evidence without world saves or mod binaries
        if: always() && matrix.candidate == 'lostcities'
        uses: actions/upload-artifact@v4
        with:
          name: uc-native-city-survey-${{ github.sha }}
          path: |
            rpg-core/run-world-survey/world-survey.json
            rpg-core/run-world-survey/logs/*.log
          retention-days: 7
          if-no-files-found: warn
      - name: Prepare a disposable client clone of the generated survey world
        if: success() && matrix.candidate == 'lostcities'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri libgl1 mesa-utils
          python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          python - <<'PY'
          import shutil
          from pathlib import Path
          source=Path('rpg-core/run-world-survey')
          target=Path('rpg-core/run-world-tour')
          assert not target.exists()
          shutil.copytree(source/'world',target/'saves/world')
          shutil.copytree(source/'config',target/'config')
          shutil.copytree(source/'mods',target/'mods')
          # The tour reads where the measured bridges are from the survey report.
          shutil.copy(source/'world-survey.json',target/'world-survey.json')
          # The early loading window is irrelevant to world evidence and its GL
          # negotiation is the observed failure mode under llvmpipe.
          (target/'config'/'fml.toml').write_text('earlyWindowControl = false\n')
          PY
      - name: Capture actual generated city environments with a native Minecraft client
        if: success() && matrix.candidate == 'lostcities'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '1'
          # Forge's early display requests GL 4.6 first and times out on llvmpipe
          # without this override; the passing Visual QA client uses the same one.
          MESA_GL_VERSION_OVERRIDE: '3.3'
          ALSOFT_DRIVERS: 'null'
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          rm -f rpg-core/run-world-tour/world-tour-complete.txt
          setsid xvfb-run -a -s '-screen 0 1920x1080x24' \
            timeout 1700s gradle -p rpg-core runClient -PucWorldCandidate=lostcities -PucEconomyTest=true \
              -PucRunDir=run-world-tour -PucWorldTour=true --no-daemon --stacktrace \
              > /tmp/uc-world-tour-client.log 2>&1 &
          game_pid=$!
          completed=0
          # Poll instead of waiting for a fixed timeout so a dead early display
          # fails in seconds and every later stage is bounded by the harness.
          for step in $(seq 1 570); do
            if test -s rpg-core/run-world-tour/world-tour-complete.txt; then completed=1; break; fi
            if ! kill -0 "$game_pid" 2>/dev/null; then break; fi
            sleep 3
          done
          kill -- -"$game_pid" 2>/dev/null || true
          wait "$game_pid" || true
          grep -E 'UC-WORLD-VISUAL|EARLYDISPLAY|ERROR|Exception' /tmp/uc-world-tour-client.log | tail -60 || true
          mkdir -p rpg-core/run-world-tour/logs
          cp /tmp/uc-world-tour-client.log rpg-core/run-world-tour/logs/world-tour-client-stdout.log
          test "$completed" -eq 1 || { echo "NATIVE WORLD TOUR DID NOT COMPLETE"; exit 1; }
      - name: Check actual city and bridge frames are real terrain, not blank or duplicate
        if: success() && matrix.candidate == 'lostcities'
        run: |
          python - <<'PY'
          from pathlib import Path
          from struct import unpack
          from PIL import Image, ImageStat
          import hashlib
          import json
          hashes=set(); failures=[]
          survey=json.loads(Path('rpg-core/run-world-survey/world-survey.json').read_text())
          frames=[f'{c}-{k}' for c in ('ironhaven','valewood','blackwater') for k in ('top','oblique')]
          for route in survey['roads']['routes']:
              if 'showcase' in route:
                  frames+=[f"road-{route['id']}-bridge-oblique", f"road-{route['id']}-deck"]
              if 'land_showcase' in route:
                  frames.append(f"road-{route['id']}-land")
          assert sum(f.startswith('road-') for f in frames)==6, 'both built roads need a bridge and a ground stretch to photograph'
          assert not (set(p.name for p in Path('rpg-core/run-world-tour/screenshots').glob('uc-world-*.png'))-{f'uc-world-{f}.png' for f in frames}), 'unexpected frame'
          for city in frames:
              png=Path(f'rpg-core/run-world-tour/screenshots/uc-world-{city}.png').read_bytes()
              assert png[:8]==b'\x89PNG\r\n\x1a\n'
              assert unpack('>II',png[16:24])==(1920,1080)
              image=Image.open(f'rpg-core/run-world-tour/screenshots/uc-world-{city}.png').convert('RGB')
              stats=ImageStat.Stat(image)
              print(city, 'stddev', [round(v,1) for v in stats.stddev], 'mean', [round(v,1) for v in stats.mean])
              if max(stats.stddev)<=8: failures.append(f'{city}: blank framebuffer')
              digest=hashlib.sha256(image.tobytes()).hexdigest()
              if digest in hashes: failures.append(f'{city}: duplicate environment')
              hashes.add(digest)
          assert not failures, failures
          PY
      - name: Print downscaled copies of the city and bridge frames into the job log for review
        if: always() && matrix.candidate == 'lostcities'
        run: |
          python scripts/emit_review_images.py --max-width 640 --quality 55 rpg-core/run-world-tour/screenshots/uc-world-*.png || true
      - name: Upload short-lived actual-world images for explicit review
        if: always() && matrix.candidate == 'lostcities'
        uses: actions/upload-artifact@v4
        with:
          name: uc-visual-gallery-world-${{ github.sha }}
          path: rpg-core/run-world-tour/screenshots/uc-world-*.png
          retention-days: 1
          if-no-files-found: warn
      - name: Preserve client world-tour diagnostics without saves
        if: always() && matrix.candidate == 'lostcities'
        uses: actions/upload-artifact@v4
        with:
          name: uc-world-tour-diagnostics-${{ github.sha }}
          path: |
            rpg-core/run-world-tour/logs/*.log
            rpg-core/run-world-tour/crash-reports/*.txt
            rpg-core/run-world-tour/world-tour-complete.txt
            rpg-core/run-world-tour/world-tour-state.txt
          retention-days: 7
          if-no-files-found: warn
      - name: Report measured scope
        if: always()
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          echo "## $CANDIDATE" >> "$GITHUB_STEP_SUMMARY"
          echo "This is one **isolated headless startup/GameTest smoke test**, using a temporary original-author CurseMaven dependency." >> "$GITHUB_STEP_SUMMARY"
          echo "Lost Cities additionally receives our own prototype low-code JAR in an ephemeral run/mods folder." >> "$GITHUB_STEP_SUMMARY"
          echo "Passing does not demonstrate actual generated bridges, populated towns, loot refill in chests, or war AI." >> "$GITHUB_STEP_SUMMARY"
          echo "No third-party mod binaries are committed or uploaded in CI artifacts." >> "$GITHUB_STEP_SUMMARY"
