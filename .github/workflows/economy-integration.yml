name: Real economy and profession GameTests
on:
  pull_request:
    paths: ['rpg-core/**', 'content/integrations/qshop/**', 'scripts/install_qshop_templates.py', '.github/workflows/economy-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: economy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  economy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Stage original templates in disposable instance
        run: python scripts/install_qshop_templates.py --server-root rpg-core/run-economy
      - name: Build and run actual Q Shop wallet, buy/sell and profession tests
        run: |
          gradle -p rpg-core build runGameTestServer -PucEconomyTest=true -PucRunDir=run-economy --no-daemon --stacktrace
          # A Forge GameTest server that fails to start (a broken datapack, a registry error) still exits 0, so the result line is the evidence.
          # the whole run's log: Forge rolls latest.log over at midnight, so a job that runs past 00:00 UTC has its first part in an archive (scripts/ci_run_log.py)
          log=$(python3 scripts/ci_run_log.py rpg-core/run-economy/logs)
          grep -E "All [0-9]+ required tests passed" "$log"
      - name: Print which tests failed (a failing GameTest makes the server exit 1; the reason is in the log)
        if: failure()
        run: |
          log=$(python3 scripts/ci_run_log.py rpg-core/run-economy/logs) || log=rpg-core/run-economy/logs/latest.log
          grep -E 'failed!|required tests|GAME TESTS COMPLETE|Exception caught|Crash report' "$log" | head -n 40 || true
      - name: Preserve diagnostics without third-party binaries or world saves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uc-economy-diagnostics-${{ github.sha }}
          path: rpg-core/run-economy/logs/*.log
          retention-days: 3
          if-no-files-found: warn
