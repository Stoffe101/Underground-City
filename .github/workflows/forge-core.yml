name: Forge RPG Core

on:
  pull_request:
    paths:
      - 'rpg-core/**'
      - '.github/workflows/forge-core.yml'
  push:
    branches: [main]
    paths:
      - 'rpg-core/**'
      - '.github/workflows/forge-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Forge 1.20.1 RPG Core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python for export packaging
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build mod (reobfuscates jar)
        run: gradle -p rpg-core build --no-daemon --stacktrace
      - name: Run in-engine dedicated GameTestServer checks
        run: |
          gradle -p rpg-core runGameTestServer --no-daemon --stacktrace
          # A Forge GameTest server that fails to start (a broken datapack, a registry error) still exits 0, so the result line is the evidence.
          # the whole run's log: Forge rolls latest.log over at midnight, so a job that runs past 00:00 UTC has its first part in an archive (scripts/ci_run_log.py)
          log=$(python3 scripts/ci_run_log.py rpg-core/run/logs)
          grep -E "All [0-9]+ required tests passed" "$log"
      - name: GameTests with a SYNTHETIC private pack in a folder outside the checkout (the private-content loader; invented content only, D-116)
        run: |
          python scripts/private_pack_tool.py fixture "$RUNNER_TEMP/uc-private"
          gradle -p rpg-core runGameTestServer -PucPrivateContent="$RUNNER_TEMP/uc-private" -PucRunDir=run-private --no-daemon --stacktrace
          log=$(python3 scripts/ci_run_log.py rpg-core/run-private/logs)
          grep -E "All [0-9]+ required tests passed" "$log"
          grep -E "\[UC-PRIVATE\] pack 'uc_private_fixture'" "$log"
      - name: Print which tests failed (a failing GameTest makes the server exit 1; the reason is in the log)
        if: failure()
        run: |
          # both GameTest runs: the plain one and the one with the synthetic private pack
          for run in run run-private; do
            [ -d "rpg-core/$run/logs" ] || continue
            echo "== $run"
            log=$(python3 scripts/ci_run_log.py "rpg-core/$run/logs") || log="rpg-core/$run/logs/latest.log"
            grep -E 'failed!|required tests|GAME TESTS COMPLETE|Exception caught|Crash report' "$log" | head -n 40 || true
          done
      - name: Inspect generated files
        run: |
          ls -lah rpg-core/build/libs
          test -n "$(find rpg-core/build/libs -maxdepth 1 -name 'underground_city-*.jar' -print -quit)"
      - name: Create clean Modrinth and CurseForge starter imports
        run: |
          JAR="$(find rpg-core/build/libs -maxdepth 1 -name 'underground_city-*.jar' -print -quit)"
          python scripts/package_starter.py --jar "$JAR" --output build/preview-packs
          python scripts/audit_modpack.py --pack build/preview-packs/underground-city-core-preview.mrpack > /dev/null
          python scripts/audit_modpack.py --pack build/preview-packs/underground-city-core-preview-curseforge.zip > /dev/null
      - name: Upload starter import archives
        uses: actions/upload-artifact@v4
        with:
          name: underground-city-importable-starter-${{ github.sha }}
          path: build/preview-packs/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload mod for development review
        uses: actions/upload-artifact@v4
        with:
          name: underground-city-rpg-core-${{ github.sha }}
          path: rpg-core/build/libs/underground_city-*.jar
          if-no-files-found: error
          retention-days: 7
