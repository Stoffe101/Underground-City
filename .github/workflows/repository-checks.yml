name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Check documentation and candidate register
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history, so the guard can read all of it)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate
        run: python scripts/validate_repo.py
      - name: Private-content guard (nothing privately licensed is tracked, uploaded or in the history)
        run: python scripts/check_private_content.py
