name: Two real cloud clients and server restart
on:
  pull_request:
    paths: ['rpg-core/**', 'scripts/run_cloud_journey.py', '.github/workflows/connected-clients.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: connected-clients-${{ github.ref }}
  cancel-in-progress: true
jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Install cloud virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri libgl1
      - name: Exercise two actual clients through UI actions and dedicated-server restart
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python scripts/run_cloud_journey.py
      - name: Print why a journey process stopped (the logs are also an artifact)
        if: failure()
        run: |
          for log in build/cloud-journey/logs/*.log; do
            echo "=== ${log}"
            grep -nE 'Exception in thread|Crash report saved|Failed to start|Exception caught during firing|FAILED|FAILURE|Caused by|Could not|\[UC-JOURNEY\]' -A 4 "${log}" | head -n 60 || true
            tail -n 25 "${log}"
          done
      - name: Preserve reports and diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uc-connected-client-evidence-${{ github.sha }}
          path: |
            build/cloud-journey/logs/*.log
            build/cloud-journey/report.json
            rpg-core/run-journey-server/journey-phase*.json
          retention-days: 7
          if-no-files-found: warn
  journey-full-pack:
    name: journey with the TaCZ, vehicle, wine and crop mods loaded
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      # The same two-client journey with the third-party dev-pack sets loaded on the server and on both clients (a flat world: no Lost Cities, no boats).
      UC_JOURNEY_PACK: firearms,vehicles,vintner,farming
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Install cloud virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri libgl1
      - name: Exercise two actual clients through UI actions and dedicated-server restart with the mods
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python scripts/run_cloud_journey.py
      - name: Print why a journey process stopped (the logs are also an artifact)
        if: failure()
        run: |
          for log in build/cloud-journey/logs/*.log; do
            echo "=== ${log}"
            grep -nE 'Exception in thread|Crash report saved|Failed to start|OutOfMemory|Exception caught during firing|FAILED|FAILURE|Caused by|Could not|\[UC-JOURNEY\]' -A 4 "${log}" | head -n 60 || true
            tail -n 25 "${log}"
          done
      - name: Preserve reports and diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uc-connected-client-full-pack-evidence-${{ github.sha }}
          path: |
            build/cloud-journey/logs/*.log
            build/cloud-journey/report.json
            rpg-core/run-journey-server/journey-phase*.json
          retention-days: 7
          if-no-files-found: warn
  journey-every-pack:
    name: journey with every dev-pack set loaded (Lost Cities and Modern Life too)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      # The same two-client journey with every dev-pack set the default launch and the candidates use, Lost Cities and Modern Life included, loaded on the server and
      # on both clients. The world is still the flat journey fixture, so this proves that the mods load and sync together in multiplayer, not that Lost Cities generates.
      UC_JOURNEY_PACK: world,firearms,vehicles,boats,vintner,farming
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Install cloud virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri libgl1
      - name: Exercise two actual clients through UI actions and dedicated-server restart with every set
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python scripts/run_cloud_journey.py
      - name: Print why a journey process stopped (the logs are also an artifact)
        if: failure()
        run: |
          for log in build/cloud-journey/logs/*.log; do
            echo "=== ${log}"
            grep -nE 'Exception in thread|Crash report saved|Failed to start|OutOfMemory|Exception caught during firing|FAILED|FAILURE|Caused by|Could not|\[UC-JOURNEY\]' -A 4 "${log}" | head -n 60 || true
            tail -n 25 "${log}"
          done
      - name: Preserve reports and diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uc-connected-client-every-pack-evidence-${{ github.sha }}
          path: |
            build/cloud-journey/logs/*.log
            build/cloud-journey/report.json
            rpg-core/run-journey-server/journey-phase*.json
          retention-days: 7
          if-no-files-found: warn
