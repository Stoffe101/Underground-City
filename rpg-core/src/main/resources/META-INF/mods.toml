modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Stoffe101/Underground-City/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
displayURL="https://github.com/Stoffe101/Underground-City"
displayTest="MATCH_VERSION"

[[mixins]]
config="underground_city.mixins.json"

[[dependencies.underground_city]]
modId="qshop"
mandatory=false
versionRange="[1.8.4]"
ordering="AFTER"
side="BOTH"

[[dependencies.underground_city]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.underground_city]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
