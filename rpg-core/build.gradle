import groovy.json.JsonSlurper

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// ---------------------------------------------------------------------------------------------------------------
// Which third-party mods does this run load?
//
//   gradlew runClient                    the COMPLETE development pack (Core, Q Shop, Lost Cities, TaCZ, TaCZ
//                                        Blueprints, Modern Life, Immersive Vehicles and both official packs) in the
//                                        disposable game directory rpg-core/run-dev, opening the seed-5908 dev world
//   gradlew runServer                    the same pack as a dedicated server (accept the EULA first, see docs)
//   gradlew runClient -PucPack=none      Core alone
//   gradlew runClient -PucPack=firearms,vehicles   chosen sets (world, firearms, vehicles, boats)
//
// Every harness flag below (ucVisualCapture, ucWorldTour, ucJourneyClient, ...) keeps its old, narrower meaning, so
// the hosted workflows are unchanged. Jars always come from the original author's page (Modrinth Maven, or the Q Shop
// GitHub release), are SHA-512/SHA-256 verified against content/modpacks/dev-pack.json, and are never committed.
// ---------------------------------------------------------------------------------------------------------------
def harnessFlags = ['ucPack', 'ucEconomyTest', 'ucScreeningMod', 'ucWorldCandidate', 'ucWorldTour', 'ucJourneyClient',
                    'ucVisualCapture', 'ucWorldSurvey', 'ucSeedScan', 'ucJourneyPhase', 'ucJourneyScenario', 'ucJourneySurvival', 'ucJourneyWorld', 'ucPerfProbe', 'ucStallProbe', 'ucTerrainMap', 'ucCityProbe', 'ucBurglary', 'ucPhotoTour']
def requestedTasks = gradle.startParameter.taskNames.collect { it.tokenize(':').last() }
def userLaunch = requestedTasks.any { it in ['runClient', 'runServer'] } &&
        !harnessFlags.any { providers.gradleProperty(it).isPresent() }
def explicitPack = providers.gradleProperty('ucPack').orNull
// -PucExtraSets=survival (or vintner,farming,qol) adds opt-in sets to the complete development pack without leaving the developer launch (the dev world and the bootstrap stay on)
def extraSets = providers.gradleProperty('ucExtraSets').orElse('').get().trim()
def packSelection = explicitPack != null ? (explicitPack == 'none' ? '' : explicitPack)
        : (userLaunch ? 'world,firearms,vehicles,boats' + (extraSets.isEmpty() ? '' : ',' + extraSets) : '')
def devPackSets = packSelection.split(',').collect { it.trim() }.findAll { !it.isEmpty() }
def devWorldWanted = userLaunch || providers.gradleProperty('ucDevWorld').orNull == 'true'
def autoWorld = devWorldWanted && providers.gradleProperty('ucAutoWorld').orNull != 'false' && !providers.gradleProperty('ucPlaytest').isPresent()
def economyRuntime = providers.gradleProperty('ucEconomyTest').orNull == 'true' || userLaunch
def runDirName = providers.gradleProperty('ucRunDir').orElse(userLaunch ? 'run-dev' : 'run').get()
// Two world layouts exist (D-104) and a launch carries exactly one of them (WorldLayout refuses a mismatch): a plain runClient or runServer starts the ARCHIPELAGO
// (the world type "Underground City: Archipelago", dev world UC-Archipelago); -PucWorldLayout=legacy starts the original seed-5908 triangle and its saved dev world UC-Dev-5908
// exactly as before, and every scripted run (playtest, launch smoke, CI harness) keeps the legacy layout unless it asks otherwise.
def interactiveLaunch = userLaunch && !providers.gradleProperty('ucPlaytest').isPresent() && !providers.gradleProperty('ucLaunchSmoke').isPresent()
def worldLayout = providers.gradleProperty('ucWorldLayout').orElse(interactiveLaunch ? 'archipelago' : 'legacy').get()
if (!(worldLayout in ['legacy', 'archipelago'])) throw new GradleException('ucWorldLayout must be legacy or archipelago')
def worldPackName = worldLayout == 'archipelago' ? 'world-archipelago' : 'world-prototype'
def devWorldName = worldLayout == 'archipelago' ? 'UC-Archipelago' : 'UC-Dev-5908'

def devPackMods = []
if (!devPackSets.isEmpty()) {
    def manifest = new JsonSlurper().parse(file('../content/modpacks/dev-pack.json'))
    def byId = manifest.mods.collectEntries { [(it.id): it] }
    def chosen = new LinkedHashMap()
    def include
    include = { String id ->
        def mod = byId[id]
        if (mod == null) throw new GradleException('Unknown dev-pack mod ' + id)
        mod.requires.each { include(it) }
        chosen[id] = mod
    }
    manifest.mods.findAll { mod -> mod.sets.any { devPackSets.contains(it) } }.each { include(it.id) }
    if (chosen.isEmpty()) throw new GradleException('No dev-pack mods in sets ' + devPackSets + ' (known sets: world, firearms, vehicles, boats, vintner, farming, qol, survival, legacy_travelers, performance, navigation, citytweaks)')
    devPackMods = chosen.values().toList()
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file(runDirName)
            property 'forge.logging.console.level', 'info'
            // Forge 1.20.1 does not read [[mixins]] from mods.toml. A development run loads our (optional, pseudo-targeted) mixin config
            // through this argument; the built jar names it in its manifest (MixinConfigs, below).
            args '--mixin.config', 'underground_city.mixins.json'
            // D-103: Core refuses to load a world that holds Traveler's Backpack data without the mod. -PucAcceptLegacyBackpackLoss=true is the deliberate way past it
            // for a development launch (Core copies the world to uc-backups/ first); nothing sets it by default.
            if (providers.gradleProperty('ucAcceptLegacyBackpackLoss').orNull == 'true') property 'uc.acceptLegacyBackpackLoss', 'true'
            if (!devPackMods.isEmpty()) {
                // Dev-pack mods such as TaCZ are mixin mods whose refmaps use SRG names; this development environment
                // runs with the official names, so Mixin must remap the refmaps (the documented ForgeGradle 6 recipe).
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
                // Forge throws "Cannot get config value before config is loaded" ONLY when FMLEnvironment.production is
                // false, i.e. only in a development environment. Modern Life reads its config in its constructor (the
                // read is harmless in a real client or server), and FMLEnvironment also treats the system property
                // "production" as production. Setting it is the supported way to run such a mod from a ForgeGradle run.
                if (devPackMods.any { it.mod_id == 'modernlife' }) property 'production', 'true'
            }
            mods {
                underground_city { source sourceSets.main }
            }
        }
        client {
            if (userLaunch) {
                jvmArgs '-Xmx4G'
                if (autoWorld) jvmArgs "-Duc.devWorld=${devWorldName}", '-Duc.devBootstrap=true'
                if (autoWorld && worldLayout == 'archipelago') jvmArgs '-Duc.devPreset=underground_city:archipelago'
                // Two developers testing together need different offline names (the default profile is "Dev").
                if (providers.gradleProperty('ucUsername').isPresent()) args '--username', providers.gradleProperty('ucUsername').get()
            }
            if (providers.gradleProperty('ucPlaytest').isPresent()) {
                // Scripted player (Playtest.java): a scenario name such as input, gun, car, boat, walk, trace.
                jvmArgs "-Duc.playtest=${providers.gradleProperty('ucPlaytest').get()}", "-Duc.xinput=${file('../scripts/xinput_helper.py').absolutePath}", '-XX:ActiveProcessorCount=2', '-Xmx4G'
                // Scenario options: -PucPtRoute=valewood_blackwater becomes -Duc.playtest.route=..., -PucPtLimitseconds=3600 and so on.
                project.properties.each { name, value ->
                    if (name.startsWith('ucPt') && name.length() > 4) jvmArgs "-Duc.playtest.${name.substring(4).toLowerCase()}=${value}"
                }
                args '--width', '1280', '--height', '720'
                if (worldLayout == 'archipelago') jvmArgs '-Duc.devPreset=underground_city:archipelago'
            }
            if (providers.gradleProperty('ucPhotoTour').isPresent()) {
                // a spectator camera flies to each viewpoint of a shot list (PhotoTour) in the world the development launcher creates; frames land in <run dir>/screenshots
                jvmArgs "-Duc.photoTour=${providers.gradleProperty('ucPhotoTour').get()}", "-Duc.devWorld=${providers.gradleProperty('ucPhotoWorld').orElse(devWorldName).get()}", '-XX:ActiveProcessorCount=2', "-Xmx${providers.gradleProperty('ucClientHeap').orElse('3G').get()}"
                if (worldLayout == 'archipelago') jvmArgs '-Duc.devPreset=underground_city:archipelago'
                args '--username', 'UC_Photographer', '--width', providers.gradleProperty('ucPhotoWidth').orElse('1920').get(), '--height', providers.gradleProperty('ucPhotoHeight').orElse('1080').get()
            }
            if (providers.gradleProperty('ucLaunchSmoke').orNull == 'true') {
                // CI / verification: join the dev world, report facts, take a screenshot, quit.
                jvmArgs '-Duc.launchSmoke=true', '-XX:ActiveProcessorCount=2'
                args '--width', '1920', '--height', '1080'
            }
            if (providers.gradleProperty('ucWorldTour').orNull == 'true') {
                jvmArgs '-Duc.worldTour=true', '-Xmx2G', '-XX:ActiveProcessorCount=2'
                args '--username', 'UC_WorldSurvey', '--width', '1920', '--height', '1080'
            }
            if (providers.gradleProperty('ucJourneyClient').isPresent()) {
                jvmArgs '-Duc.journey.client=true', "-Xmx${providers.gradleProperty('ucClientHeap').orElse('1G').get()}", '-XX:ActiveProcessorCount=2'
                args '--username', providers.gradleProperty('ucJourneyClient').get(), '--width', '1920', '--height', '1080'
                if (providers.gradleProperty('ucJourneyScenario').isPresent()) {
                    // a named journey scenario (CrewJourneyActions for "crew") needs to know its phase as well
                    jvmArgs "-Duc.journey.scenario=${providers.gradleProperty('ucJourneyScenario').get()}"
                    if (providers.gradleProperty('ucJourneyPhase').isPresent()) jvmArgs "-Duc.journey.phase=${providers.gradleProperty('ucJourneyPhase').get()}"
                }
                // the combined journey's client half (SurvivalJourneyActions): the Smith buys, wears and opens a backpack on the real screens, with screenshots at three window sizes
                if (providers.gradleProperty('ucJourneySurvival').isPresent()) jvmArgs '-Duc.journey.survival=true'
            }
            if (providers.gradleProperty('ucVisualCapture').orNull == 'true') {
                def scale = providers.gradleProperty('ucVisualScale').orElse('3').get()
                def screenWidth = providers.gradleProperty('ucVisualWidth').orElse('1920').get()
                def screenHeight = providers.gradleProperty('ucVisualHeight').orElse('1080').get()
                jvmArgs '-Duc.visualCapture=true', "-Duc.visualCapture.scale=${scale}"
                args '--width', screenWidth, '--height', screenHeight
            }
        }
        server {
            args '--nogui'
            if (userLaunch) jvmArgs '-Duc.devBootstrap=true'
            if (providers.gradleProperty('ucBootSmoke').isPresent()) {
                jvmArgs '-Duc.bootSmoke=true'
            }
            if (providers.gradleProperty('ucPerfProbe').orNull == 'true') {
                // a dedicated server that measures the cost of a tick with and without Founders Row (PerfProbe.java), then stops
                jvmArgs '-Duc.perfProbe=true', '-Xmx2G'
            }
            if (providers.gradleProperty('ucTerrainMap').isPresent()) {
                // samples the world's own chunk generator and biome source on a grid and writes a CSV (TerrainMapHarness); -PucTmX0=-900 -PucTmX1=2500 -PucTmZ0 -PucTmZ1 -PucTmStep=16
                jvmArgs "-Duc.terrainMap=${providers.gradleProperty('ucTerrainMap').get()}", "-Xmx${providers.gradleProperty('ucServerHeap').orElse('3G').get()}", '-Duc.layoutGuard=off' // a disposable survey server, no package: WorldLayout would otherwise refuse the archipelago terrain without its cities
                project.properties.each { name, value ->
                    if (name.startsWith('ucTm') && name.length() > 4) jvmArgs "-Duc.terrainMap.${name.substring(4).toLowerCase()}=${value}"
                    // calibration knobs of the archipelago terrain (IslandField); only a survey sets them
                    if (name == 'ucIslandCityContinents') jvmArgs "-Duc.island.cityContinents=${value}"
                    if (name == 'ucIslandFlatErosion') jvmArgs "-Duc.island.flatErosion=${value}"
                    if (name == 'ucIslandPlateauRidges') jvmArgs "-Duc.island.plateauRidges=${value}"
                }
            }
            if (providers.gradleProperty('ucCityProbe').isPresent()) {
                // generates the chunks around each city and reports the real vegetation, doors, glass and containers (CityProbe); -PucCpRadius=6 -PucCpCities=ironhaven,valewood -PucCpExtra=x:z,x:z
                jvmArgs "-Duc.cityProbe=${providers.gradleProperty('ucCityProbe').get()}", "-Xmx${providers.gradleProperty('ucServerHeap').orElse('3G').get()}"
                project.properties.each { name, value ->
                    if (name.startsWith('ucCp') && name.length() > 4) jvmArgs "-Duc.cityProbe.${name.substring(4).toLowerCase()}=${value}"
                }
            }
            if (providers.gradleProperty('ucBurglary').isPresent()) {
                // the building guard and the lock proved on one real generated apartment block (BurglaryHarness); -PucBgPhase=a|b -PucBgState=<file>
                jvmArgs "-Duc.burglary=${providers.gradleProperty('ucBurglary').get()}", "-Xmx${providers.gradleProperty('ucServerHeap').orElse('3G').get()}"
                project.properties.each { name, value ->
                    if (name.startsWith('ucBg') && name.length() > 4) jvmArgs "-Duc.burglary.${name.substring(4).toLowerCase()}=${value}"
                }
            }
            if (providers.gradleProperty('ucStallProbe').orNull == 'true') {
                // reproduces and measures the long server ticks after bulk chunk generation on a Lost Cities world (StallProbe.java); -PucStallRadius=8 -PucStallMode=bulk|paced -PucStallCenter=0,0 -PucStallSettle=1200
                jvmArgs '-Duc.stallProbe=true', "-Xmx${providers.gradleProperty('ucServerHeap').orElse('3G').get()}"
                project.properties.each { name, value ->
                    if (name.startsWith('ucStall') && name.length() > 8 && name != 'ucStallProbe') jvmArgs "-Duc.stallProbe.${name.substring(7).toLowerCase()}=${value}"
                }
            }
            if (providers.gradleProperty('ucWorldSurvey').orNull == 'true') {
                jvmArgs '-Duc.worldSurvey=true', '-XX:ActiveProcessorCount=2'
            }
            if (providers.gradleProperty('ucSeedScan').isPresent()) {
                jvmArgs "-Duc.seedScan=${providers.gradleProperty('ucSeedScan').get()}", '-XX:ActiveProcessorCount=2'
            }
            if (providers.gradleProperty('ucJourneyPhase').isPresent()) {
                jvmArgs "-Duc.journey.phase=${providers.gradleProperty('ucJourneyPhase').get()}", "-Xmx${providers.gradleProperty('ucServerHeap').orElse(providers.gradleProperty('ucClientHeap').orElse('1G').get()).get()}", '-XX:ActiveProcessorCount=2'
            }
            if (providers.gradleProperty('ucJourneyScenario').isPresent()) {
                jvmArgs "-Duc.journey.scenario=${providers.gradleProperty('ucJourneyScenario').get()}"
            }
            // the combined journey (D-091): survival goods, the wayside shelter and the interrupted purchase, optionally on a generated Lost Cities world instead of the flat fixture
            if (providers.gradleProperty('ucJourneySurvival').isPresent()) jvmArgs '-Duc.journey.survival=true'
            if (providers.gradleProperty('ucJourneyWorld').isPresent()) jvmArgs "-Duc.journey.world=${providers.gradleProperty('ucJourneyWorld').get()}"
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}
// Optional screening only: resolve one pinned original-author mod at a time.
// Nothing is embedded in our jar or published in CI artifacts.
def screeningModId = providers.gradleProperty('ucScreeningMod').orNull
def screeningMod = null
if (screeningModId != null && !screeningModId.trim().isEmpty()) {
    def registry = new JsonSlurper().parse(file('../content/modpacks/onboarding-candidates.json'))
    screeningMod = registry.profiles.find { it.id == screeningModId }
    if (screeningMod == null) {
        throw new GradleException("Unknown onboarding screening candidate: " + screeningModId)
    }
}
// World/economy candidates remain isolated. Resolve exactly one pinned original
// CurseForge artifact through CurseMaven for a disposable headless smoke run.
def worldCandidateId = providers.gradleProperty('ucWorldCandidate').orNull
def worldCandidate = null
if (worldCandidateId != null && !worldCandidateId.trim().isEmpty()) {
    def registry = new JsonSlurper().parse(file('../content/modpacks/world-mod-candidates.json'))
    worldCandidate = registry.candidates.find { it.id == worldCandidateId }
    if (worldCandidate == null) {
        throw new GradleException("Unknown world gameplay candidate: " + worldCandidateId)
    }
    if (screeningMod != null) {
        throw new GradleException("Do not run unrelated onboarding and world candidate tests together")
    }
}
tasks.named('jar') {
    manifest { attributes('MixinConfigs': 'underground_city.mixins.json') }
}
repositories {
    mavenCentral()
    if (!devPackMods.isEmpty()) {
        maven {
            url = uri('https://api.modrinth.com/maven')
            content { includeGroup 'maven.modrinth' }
        }
    }
    // Official author release. Transient API dependency, never bundled in Core.
    ivy {
        url = uri('https://github.com/QLNPLUS/Q-shop/releases/download')
        patternLayout { artifact 'v[revision]-forge-1.20.1/[artifact]-[revision].[ext]' }
        metadataSources { artifact() }
        content { includeGroup 'com.qshop' }
    }
    if (screeningMod != null || worldCandidate != null) {
        maven {
            url = uri('https://cursemaven.com')
            content { includeGroup 'curse.maven' }
        }
    }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf('com.qshop:qshop-forge-1.20.1:1.8.4')
    if (economyRuntime) {
        runtimeOnly fg.deobf('com.qshop:qshop-forge-1.20.1:1.8.4')
    }
    if (screeningMod != null) {
        // CurseMaven coordinates are derived solely from pinned reviewed JSON IDs.
        runtimeOnly fg.deobf("curse.maven:uc-onboarding-${screeningMod.project_id}:${screeningMod.file_id}")
    }
    if (worldCandidate != null) {
        runtimeOnly fg.deobf("curse.maven:uc-world-${worldCandidate.project_id}:${worldCandidate.file_id}")
    }
}
if (!devPackMods.isEmpty()) {
    tasks.matching { it.name.startsWith('prepareRun') }.configureEach { dependsOn 'createSrgToMcp' }
}
configurations { qshopOriginal; devPackOriginal; devPackFolder }
devPackMods.each { mod ->
    def coordinate = "maven.modrinth:${mod.slug}:${mod.version_id}"
    dependencies.add('devPackOriginal', coordinate)
    if (mod.placement == 'mods_folder') {
        // Immersive Vehicles content packs are plain asset jars that the engine finds by scanning the game directory's
        // mods folder, so they are copied there unmodified (prepareDevRun), not put on the classpath.
        dependencies.add('devPackFolder', coordinate)
    } else {
        dependencies.add('runtimeOnly', fg.deobf(coordinate))
    }
}
def verifyDevPack = tasks.register('verifyDevPack') {
    inputs.files(configurations.devPackOriginal)
    doLast {
        def expected = devPackMods.collect { it.sha512 }.toSet()
        configurations.devPackOriginal.files.each { jar ->
            def digest = java.security.MessageDigest.getInstance('SHA-512').digest(jar.bytes).encodeHex().toString()
            if (!expected.contains(digest)) {
                throw new GradleException('Dev-pack jar differs from the pinned manifest: ' + jar.name)
            }
        }
        logger.lifecycle('Verified {} pinned dev-pack jar(s) against dev-pack.json', configurations.devPackOriginal.files.size())
    }
}

// Q Shop's currencies and the civilian starter shop (original JSON authored in this repository). Without them the wallet is
// "unavailable" and every contract reports "Economy offline". Existing files are never overwritten; a world that already exists
// keeps its own world/serverconfig/qshop. Economy GameTests, the development client and server all need it.
def stageQShopTemplates = tasks.register('stageQShopTemplates') {
    onlyIf { economyRuntime }
    doLast {
        def runDir = project.file(runDirName)
        def templates = file('../content/integrations/qshop/config/qshop')
        fileTree(templates).visit { entry ->
            if (entry.isDirectory()) return
            def target = new File(runDir, 'config/qshop/' + entry.relativePath.pathString)
            if (!target.exists()) { target.parentFile.mkdirs(); entry.file.withInputStream { input -> target.withOutputStream { it << input } } }
        }
    }
}

// Prepares the game directory of a run: content-pack jars, the three-city world package, Lost Cities configuration and
// first-start options. Files that already exist (options, configuration) are never overwritten, so a developer's own
// changes and any saved worlds survive; the managed jars are refreshed.
def prepareDevRun = tasks.register('prepareDevRun') {
    dependsOn verifyDevPack
    inputs.files(configurations.devPackFolder)
    doLast {
        def runDir = project.file(runDirName)
        def modsDir = new File(runDir, 'mods')
        modsDir.mkdirs()
        def marker = new File(modsDir, '.uc-managed.txt')
        def managed = [] as Set
        if (marker.exists()) managed.addAll(marker.readLines().findAll { !it.trim().isEmpty() })
        def wanted = [] as LinkedHashSet
        configurations.devPackFolder.files.each { jar ->
            def target = new File(modsDir, jar.name)
            if (!target.exists() || target.length() != jar.length()) java.nio.file.Files.copy(jar.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            wanted << jar.name
        }
        if (devWorldWanted && devPackSets.contains('world')) {
            def pack = file("../content/generated/${worldPackName}/pack")
            def runConfig = file("../content/generated/${worldPackName}/game-config")
            if (!pack.isDirectory() || !runConfig.isDirectory()) {
                throw new GradleException("content/generated/${worldPackName} is missing; run python scripts/emit_dev_world_pack.py --layout ${worldLayout}")
            }
            def worldJar = new File(modsDir, worldLayout == 'archipelago' ? 'underground-city-world-archipelago.jar' : 'underground-city-world-prototype.jar')
            ant.zip(destfile: worldJar, basedir: pack, whenempty: 'fail', level: 9)
            wanted << worldJar.name
            fileTree(runConfig).visit { entry ->
                if (entry.isDirectory()) return
                def target = new File(runDir, entry.relativePath.pathString)
                if (!target.exists()) { target.parentFile.mkdirs(); entry.file.withInputStream { input -> target.withOutputStream { it << input } } }
            }
        }
        if (devPackSets.contains('survival')) {
            // Sophisticated Backpacks' policy (D-092): server defaults for a NEW world and the Core item switches. Existing files are never overwritten.
            def survivalConfig = file('../content/generated/survival-config')
            if (!survivalConfig.isDirectory()) throw new GradleException('content/generated/survival-config is missing; run python scripts/generate_backpack_config.py')
            fileTree(survivalConfig).visit { entry ->
                if (entry.isDirectory()) return
                def target = new File(runDir, entry.relativePath.pathString)
                if (!target.exists()) { target.parentFile.mkdirs(); entry.file.withInputStream { input -> target.withOutputStream { it << input } } }
            }
        }
        managed.findAll { !wanted.contains(it) }.each { stale -> new File(modsDir, stale).delete() }
        marker.text = wanted.join('\n') + '\n'
        def options = new File(runDir, 'options.txt')
        if (!options.exists()) {
            options.text = ['version:3465', 'lang:en_us', 'tutorialStep:none', 'onboardAccessibility:false', 'pauseOnLostFocus:false',
                            'skipMultiplayerWarning:true', 'joinedFirstServer:true'].join('\n') + '\n'
        }
        def serverProperties = new File(runDir, 'server.properties')
        if (devWorldWanted && !serverProperties.exists()) {
            // Dedicated dev server: the same seed as the client's dev world. online-mode stays at its default (true).
            // A new archipelago server needs its world type (WorldLayout refuses to start an ordinary world with the archipelago package, D-104); the legacy layout keeps the ordinary one.
            def properties = ['level-seed=5908', 'motd=Underground City development server', 'view-distance=8',
                              'simulation-distance=6', 'difficulty=normal', 'gamemode=survival']
            if (worldLayout == 'archipelago') properties.add(0, 'level-type=underground_city:archipelago')
            serverProperties.text = properties.join('\n') + '\n'
        }
        def eula = new File(runDir, 'eula.txt')
        if (providers.gradleProperty('ucAcceptEula').orNull == 'true' && !eula.exists()) {
            eula.text = 'eula=true\n'
        }
        logger.lifecycle('Game directory {} prepared: {} managed jar(s) in mods/', runDir, wanted.size())
    }
}
tasks.matching { it.name.startsWith('run') }.configureEach {
    dependsOn verifyDevPack
    dependsOn stageQShopTemplates
    if (!devPackMods.isEmpty() || devWorldWanted) dependsOn prepareDevRun
}
dependencies { qshopOriginal 'com.qshop:qshop-forge-1.20.1:1.8.4' }
def verifyQShopRelease = tasks.register('verifyQShopRelease') {
    inputs.files(configurations.qshopOriginal)
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
            .digest(configurations.qshopOriginal.singleFile.bytes).encodeHex().toString()
        if (digest != 'ab32e33a7190bbcb7b4b10d9fe6ae4a38f3e65eba5ea1ac9f315d3bd798c5199') {
            throw new GradleException('Official Q Shop 1.8.4 release checksum mismatch')
        }
    }
}
tasks.named('compileJava').configure { dependsOn verifyQShopRelease }
tasks.named('processResources', ProcessResources).configure {
    def props = [
        minecraft_version_range: minecraft_version_range,
        forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties(props)
    filesMatching('META-INF/mods.toml') { expand props }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
